version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: lenscraft-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=lenscraft_db

  # LensCraft Fullstack Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenscraft-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/lenscraft_db
      - JWT_SECRET=lenscraft_production_secure_secret_key_change_me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=*
      # Optional: Cloudinary configuration
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongodb

volumes:
  mongo_data:
    driver: local
